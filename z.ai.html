<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyCamp — Полный курс Python</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
<style>
:root{
  --bg:#0a0a23;
  --bg-2:#1b1b32;
  --bg-3:#2a2a40;
  --bg-4:#3b3b4f;
  --panel:#1b1b32;
  --text:#f5f6f7;
  --text-dim:#a9a9b3;
  --accent:#99c9ff;
  --accent-2:#f1be32;
  --green:#74e8a3;
  --red:#ff5b5b;
  --yellow:#f1be32;
  --border:#3b3b4f;
  --code-bg:#0d0d22;
  --sidebar-w:320px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:15px;
  line-height:1.6;
  overflow:hidden;
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* ===== Header ===== */
header{
  height:56px;
  background:var(--bg-2);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 20px;
  gap:24px;
  position:relative;
  z-index:10;
}
.logo{
  font-weight:800;
  font-size:20px;
  color:var(--text);
  display:flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
}
.logo .py{color:var(--accent-2)}
.logo .camp{color:var(--accent)}
.header-progress{
  flex:1;
  max-width:400px;
  display:flex;
  align-items:center;
  gap:12px;
  font-size:13px;
  color:var(--text-dim);
}
.progress-bar{
  flex:1;
  height:8px;
  background:var(--bg-3);
  border-radius:4px;
  overflow:hidden;
}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg,var(--accent),var(--green));
  width:0%;
  transition:width .4s ease;
}
.header-right{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:16px;
}
.btn-icon{
  background:none;
  border:none;
  color:var(--text-dim);
  cursor:pointer;
  font-size:18px;
  padding:6px 8px;
  border-radius:4px;
}
.btn-icon:hover{background:var(--bg-3);color:var(--text)}
.xp-badge{
  background:var(--bg-3);
  padding:6px 12px;
  border-radius:14px;
  font-size:13px;
  color:var(--accent-2);
  font-weight:600;
}

/* ===== Layout ===== */
.layout{
  display:flex;
  height:calc(100vh - 56px);
}
.sidebar{
  width:var(--sidebar-w);
  background:var(--bg-2);
  border-right:1px solid var(--border);
  overflow-y:auto;
  flex-shrink:0;
  transition:width .25s;
}
.sidebar.collapsed{width:0;overflow:hidden}
.sidebar-inner{padding:12px 0}
.module{
  border-bottom:1px solid var(--border);
}
.module-head{
  padding:14px 18px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:600;
  font-size:14px;
  color:var(--text);
  user-select:none;
  transition:background .15s;
}
.module-head:hover{background:var(--bg-3)}
.module-head .chevron{
  margin-left:auto;
  transition:transform .2s;
  color:var(--text-dim);
  font-size:11px;
}
.module.open .chevron{transform:rotate(90deg)}
.module-icon{
  width:22px;height:22px;
  background:var(--bg-3);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;
  color:var(--accent);
  flex-shrink:0;
}
.module.done .module-icon{background:var(--green);color:var(--bg)}
.lessons{
  display:none;
  padding:4px 0 10px;
}
.module.open .lessons{display:block}
.lesson-item{
  padding:9px 18px 9px 50px;
  cursor:pointer;
  font-size:13px;
  color:var(--text-dim);
  display:flex;
  align-items:center;
  gap:8px;
  transition:all .15s;
  border-left:3px solid transparent;
}
.lesson-item:hover{background:var(--bg-3);color:var(--text)}
.lesson-item.active{
  background:var(--bg-3);
  color:var(--accent);
  border-left-color:var(--accent);
}
.lesson-check{
  width:16px;height:16px;
  border:1.5px solid var(--border);
  border-radius:50%;
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;
}
.lesson-item.done .lesson-check{
  background:var(--green);
  border-color:var(--green);
  color:var(--bg);
}
.lesson-item.done .lesson-check::before{content:'✓'}

/* ===== Main content ===== */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.main-split{
  flex:1;
  display:flex;
  overflow:hidden;
}
.content-pane{
  flex:1;
  overflow-y:auto;
  padding:32px 40px 80px;
  min-width:0;
}
.lesson-pane{
  width:50%;
  border-right:1px solid var(--border);
}
.practice-pane{
  width:50%;
  display:flex;
  flex-direction:column;
}
.lesson-header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:8px;
  font-size:13px;
  color:var(--text-dim);
}
.breadcrumb{display:flex;align-items:center;gap:6px}
.lesson-title{
  font-size:30px;
  font-weight:700;
  margin-bottom:20px;
  line-height:1.2;
}
.lesson-body{
  font-size:15px;
  line-height:1.75;
  color:var(--text);
  max-width:760px;
}
.lesson-body p{margin-bottom:16px}
.lesson-body h3{
  margin:28px 0 12px;
  font-size:19px;
  color:var(--accent);
}
.lesson-body h4{
  margin:20px 0 10px;
  font-size:16px;
  color:var(--accent-2);
}
.lesson-body ul,.lesson-body ol{margin:0 0 16px 22px}
.lesson-body li{margin-bottom:6px}
.lesson-body code{
  background:var(--code-bg);
  padding:2px 6px;
  border-radius:4px;
  font-family:'Fira Code',Consolas,monospace;
  font-size:13px;
  color:var(--accent-2);
}
.lesson-body pre{
  background:var(--code-bg);
  border:1px solid var(--border);
  border-radius:8px;
  padding:16px;
  overflow-x:auto;
  margin:14px 0 20px;
}
.lesson-body pre code{
  background:none;
  padding:0;
  color:var(--text);
  font-size:13.5px;
  display:block;
  white-space:pre;
}
.lesson-body strong{color:var(--accent)}
.lesson-body blockquote{
  border-left:3px solid var(--accent-2);
  padding:8px 16px;
  background:var(--bg-2);
  margin:14px 0;
  color:var(--text-dim);
  border-radius:0 6px 6px 0;
}
.lesson-body table{
  border-collapse:collapse;
  margin:14px 0 20px;
  width:100%;
}
.lesson-body th,.lesson-body td{
  border:1px solid var(--border);
  padding:8px 12px;
  text-align:left;
  font-size:13.5px;
}
.lesson-body th{background:var(--bg-2);color:var(--accent)}
.lesson-nav{
  display:flex;
  justify-content:space-between;
  margin-top:40px;
  padding-top:20px;
  border-top:1px solid var(--border);
}
.btn{
  background:var(--bg-3);
  color:var(--text);
  border:none;
  padding:9px 18px;
  border-radius:6px;
  cursor:pointer;
  font-size:14px;
  font-weight:500;
  display:inline-flex;
  align-items:center;
  gap:6px;
  transition:all .15s;
}
.btn:hover{background:var(--bg-4)}
.btn.primary{background:var(--accent);color:var(--bg);font-weight:600}
.btn.primary:hover{background:#b3d8ff}
.btn.success{background:var(--green);color:var(--bg);font-weight:600}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ===== Practice pane ===== */
.practice-header{
  padding:14px 20px;
  border-bottom:1px solid var(--border);
  background:var(--bg-2);
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:13px;
}
.tabs{display:flex;gap:0}
.tab{
  padding:8px 14px;
  cursor:pointer;
  color:var(--text-dim);
  font-size:13px;
  border-bottom:2px solid transparent;
  transition:all .15s;
}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.task-panel{
  padding:16px 20px;
  background:var(--bg-2);
  border-bottom:1px solid var(--border);
  max-height:35vh;
  overflow-y:auto;
}
.task-label{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1px;
  color:var(--accent-2);
  margin-bottom:8px;
  font-weight:700;
}
.task-text{
  font-size:14px;
  line-height:1.65;
  color:var(--text);
  margin-bottom:12px;
}
.task-text code{background:var(--code-bg);padding:2px 5px;border-radius:3px;color:var(--accent-2);font-size:12.5px}
.hint-box{
  margin-top:12px;
  padding:10px 14px;
  background:var(--bg-3);
  border-left:3px solid var(--yellow);
  border-radius:0 6px 6px 0;
  font-size:13px;
  color:var(--text-dim);
  display:none;
}
.hint-box.show{display:block}
.editor-wrap{
  flex:1;
  display:flex;
  flex-direction:column;
  min-height:200px;
}
.editor-toolbar{
  padding:8px 14px;
  background:var(--bg-2);
  border-bottom:1px solid var(--border);
  display:flex;
  gap:8px;
  align-items:center;
}
.editor-toolbar .spacer{flex:1}
.CodeMirror{
  flex:1;
  height:auto !important;
  font-size:14px;
  font-family:'Fira Code',Consolas,monospace;
  background:var(--code-bg) !important;
}
.CodeMirror-gutters{background:var(--code-bg) !important;border-right:1px solid var(--border) !important}
.output-wrap{
  height:200px;
  display:flex;
  flex-direction:column;
  border-top:1px solid var(--border);
  background:#000;
}
.output-head{
  padding:6px 14px;
  background:var(--bg-2);
  font-size:12px;
  color:var(--text-dim);
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--border);
}
.output-clear{
  cursor:pointer;
  color:var(--text-dim);
  font-size:11px;
}
.output-clear:hover{color:var(--text)}
.output-body{
  flex:1;
  overflow-y:auto;
  padding:10px 14px;
  font-family:'Fira Code',Consolas,monospace;
  font-size:13px;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
}
.output-body .out{color:#e8e8e8}
.output-body .err{color:var(--red)}
.output-body .ok{color:var(--green)}
.output-body .info{color:var(--accent)}
.output-body .sys{color:var(--text-dim);font-style:italic}
.test-results{
  padding:8px 14px;
  background:var(--bg-2);
  border-top:1px solid var(--border);
  font-size:13px;
  max-height:180px;
  overflow-y:auto;
  display:none;
}
.test-results.show{display:block}
.test-row{
  display:flex;
  align-items:center;
  gap:8px;
  padding:4px 0;
  font-size:13px;
}
.test-row .icon{width:18px;text-align:center}
.test-row.pass .icon{color:var(--green)}
.test-row.fail .icon{color:var(--red)}
.test-row.pass .text{color:var(--text-dim)}
.test-row.fail .text{color:var(--red)}

/* ===== Loader overlay ===== */
.loader{
  position:fixed;
  inset:0;
  background:rgba(10,10,35,.92);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:1000;
  gap:20px;
}
.loader.hide{display:none}
.loader-spinner{
  width:60px;height:60px;
  border:4px solid var(--bg-3);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{font-size:16px;color:var(--text)}
.loader-sub{font-size:13px;color:var(--text-dim);max-width:340px;text-align:center}

/* ===== Toast ===== */
.toast-wrap{
  position:fixed;
  top:70px;right:20px;
  z-index:999;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.toast{
  background:var(--bg-3);
  border:1px solid var(--border);
  padding:14px 18px;
  border-radius:8px;
  box-shadow:0 6px 20px rgba(0,0,0,.4);
  display:flex;
  align-items:center;
  gap:10px;
  min-width:260px;
  max-width:360px;
  font-size:14px;
  animation:slideIn .3s ease;
  border-left:4px solid var(--accent);
}
.toast.success{border-left-color:var(--green)}
.toast.error{border-left-color:var(--red)}
.toast .t-icon{font-size:18px}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ===== Welcome modal ===== */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:500;
}
.modal.hide{display:none}
.modal-box{
  background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:12px;
  padding:32px;
  max-width:540px;
  width:90%;
}
.modal-box h2{
  color:var(--accent);
  margin-bottom:14px;
  font-size:24px;
}
.modal-box p{color:var(--text-dim);margin-bottom:14px;line-height:1.6}
.modal-box .btn-row{display:flex;gap:10px;margin-top:20px}

/* ===== Responsive ===== */
@media(max-width:1000px){
  .sidebar{position:fixed;left:0;top:56px;bottom:0;z-index:50;box-shadow:4px 0 20px rgba(0,0,0,.3)}
  .main-split{flex-direction:column}
  .lesson-pane,.practice-pane{width:100%;border-right:none}
  .lesson-pane{border-bottom:1px solid var(--border);max-height:50vh}
  .content-pane{padding:20px}
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bg-4);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--border)}
</style>
</head>
<body>

<!-- Loader -->
<div class="loader" id="loader">
  <div class="loader-spinner"></div>
  <div class="loader-text">Загрузка Python...</div>
  <div class="loader-sub">Первый запуск может занять 10-20 секунд. Python работает прямо в вашем браузере через WebAssembly.</div>
</div>

<!-- Header -->
<header>
  <div class="logo" onclick="goHome()">
    <span class="py">Py</span><span class="camp">Camp</span>
  </div>
  <div class="header-progress">
    <span id="progressText">0%</span>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>
  <div class="header-right">
    <span class="xp-badge" id="xpBadge">⚡ 0 XP</span>
    <button class="btn-icon" onclick="resetProgress()" title="Сбросить прогресс">↻</button>
    <button class="btn-icon" onclick="toggleSidebar()" title="Скрыть/показать меню">☰</button>
  </div>
</header>

<!-- Layout -->
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-inner" id="sidebarInner"></div>
  </aside>
  <main class="main">
    <div class="main-split">
      <!-- Lesson theory -->
      <section class="content-pane lesson-pane" id="lessonPane">
        <div class="lesson-header">
          <div class="breadcrumb" id="breadcrumb"></div>
        </div>
        <h1 class="lesson-title" id="lessonTitle"></h1>
        <div class="lesson-body" id="lessonBody"></div>
        <div class="lesson-nav">
          <button class="btn" id="prevBtn" onclick="navigateLesson(-1)">← Предыдущий</button>
          <button class="btn primary" id="nextBtn" onclick="navigateLesson(1)">Следующий →</button>
        </div>
      </section>
      <!-- Practice -->
      <section class="practice-pane">
        <div class="practice-header">
          <div class="tabs">
            <div class="tab active" onclick="switchTab('task',this)">Задание</div>
            <div class="tab" onclick="switchTab('solution',this)">Решение</div>
          </div>
          <span style="color:var(--text-dim);font-size:12px" id="lessonCounter"></span>
        </div>
        <div class="task-panel" id="taskPanel">
          <div class="task-label">📝 Задание</div>
          <div class="task-text" id="taskText"></div>
          <button class="btn" id="hintBtn" onclick="toggleHint()" style="font-size:12px;padding:5px 12px">💡 Показать подсказку</button>
          <div class="hint-box" id="hintBox"></div>
        </div>
        <div class="editor-wrap">
          <div class="editor-toolbar">
            <button class="btn primary" id="runBtn" onclick="runCode()">▶ Запустить</button>
            <button class="btn" id="checkBtn" onclick="runTests()">✓ Проверить</button>
            <button class="btn" onclick="resetCode()">↺ Сбросить код</button>
            <div class="spacer"></div>
            <span style="font-size:11px;color:var(--text-dim)" id="statusLabel"></span>
          </div>
          <textarea id="codeEditor"></textarea>
        </div>
        <div class="test-results" id="testResults"></div>
        <div class="output-wrap">
          <div class="output-head">
            <span>Консоль</span>
            <span class="output-clear" onclick="clearOutput()">очистить</span>
          </div>
          <div class="output-body" id="outputBody"></div>
        </div>
      </section>
    </div>
  </main>
</div>

<div class="toast-wrap" id="toastWrap"></div>
