<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyCamp — Полный курс Python</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a23;
    --bg-light: #1b1b32;
    --bg-lighter: #2a2a40;
    --fg: #dfdfe2;
    --fg-dim: #a9a9b8;
    --accent: #f1be32;
    --accent-hover: #facc15;
    --success: #37d98a;
    --error: #ff6b6b;
    --border: #3b3b4f;
    --code-bg: #0d1117;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.6;
    overflow: hidden;
  }
  /* HEADER */
  header {
    background: var(--bg-light);
    border-bottom: 2px solid var(--accent);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
  }
  .logo {
    font-size: 22px;
    font-weight: 800;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-icon {
    width: 32px; height: 32px;
    background: var(--accent);
    color: var(--bg);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900;
  }
  .progress-bar {
    flex: 1;
    max-width: 400px;
    margin: 0 20px;
    height: 10px;
    background: var(--bg-lighter);
    border-radius: 5px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-hover));
    transition: width 0.4s ease;
    width: 0%;
  }
  .progress-text {
    color: var(--fg-dim);
    font-size: 14px;
    min-width: 120px;
    text-align: right;
  }
  /* LAYOUT */
  .container {
    display: flex;
    height: calc(100vh - 60px);
  }
  /* SIDEBAR */
  aside {
    width: 320px;
    background: var(--bg-light);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    flex-shrink: 0;
  }
  aside::-webkit-scrollbar { width: 8px; }
  aside::-webkit-scrollbar-track { background: var(--bg-light); }
  aside::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .module {
    border-bottom: 1px solid var(--border);
  }
  .module-title {
    padding: 14px 18px;
    font-weight: 700;
    color: var(--fg);
    background: var(--bg-lighter);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    user-select: none;
  }
  .module-title:hover { background: #33334d; }
  .module-title .arrow { transition: transform 0.2s; }
  .module.open .arrow { transform: rotate(90deg); }
  .lessons {
    display: none;
    background: var(--bg);
  }
  .module.open .lessons { display: block; }
  .lesson-item {
    padding: 10px 18px 10px 32px;
    font-size: 13px;
    cursor: pointer;
    border-left: 3px solid transparent;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--fg-dim);
    transition: all 0.15s;
  }
  .lesson-item:hover {
    background: var(--bg-lighter);
    color: var(--fg);
  }
  .lesson-item.active {
    background: var(--bg-lighter);
    border-left-color: var(--accent);
    color: var(--accent);
  }
  .lesson-item.done::before {
    content: "✓";
    color: var(--success);
    font-weight: 900;
  }
  .lesson-item:not(.done)::before {
    content: "○";
    color: var(--fg-dim);
  }
  /* MAIN */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 30px 40px;
    max-width: 100%;
  }
  main::-webkit-scrollbar { width: 10px; }
  main::-webkit-scrollbar-track { background: var(--bg); }
  main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  .lesson-header {
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .lesson-header .breadcrumb {
    color: var(--fg-dim);
    font-size: 13px;
    margin-bottom: 8px;
  }
  .lesson-header h1 {
    font-size: 28px;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .lesson-content {
    max-width: 860px;
    font-size: 16px;
  }
  .lesson-content h2 {
    color: var(--accent);
    margin: 24px 0 12px;
    font-size: 22px;
  }
  .lesson-content h3 {
    color: var(--fg);
    margin: 18px 0 10px;
    font-size: 18px;
  }
  .lesson-content p { margin-bottom: 14px; }
  .lesson-content ul, .lesson-content ol {
    margin: 10px 0 14px 24px;
  }
  .lesson-content li { margin-bottom: 6px; }
  .lesson-content code {
    background: var(--code-bg);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: "Fira Code", "Courier New", monospace;
    font-size: 0.92em;
    color: #f1be32;
    border: 1px solid var(--border);
  }
  .lesson-content pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    padding: 14px 18px;
    border-radius: 6px;
    overflow-x: auto;
    margin: 14px 0;
    font-family: "Fira Code", "Courier New", monospace;
    font-size: 14px;
    line-height: 1.5;
  }
  .lesson-content pre code {
    background: none;
    border: none;
    padding: 0;
    color: #e6e6e6;
  }
  .info-box {
    background: rgba(241, 190, 50, 0.1);
    border-left: 4px solid var(--accent);
    padding: 12px 16px;
    margin: 16px 0;
    border-radius: 4px;
  }
  .info-box strong { color: var(--accent); }
  /* EDITOR */
  .editor-section {
    margin-top: 30px;
    background: var(--bg-light);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .editor-header {
    background: var(--bg-lighter);
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }
  .editor-header .title {
    font-weight: 600;
    color: var(--accent);
    font-size: 14px;
  }
  .editor-actions { display: flex; gap: 8px; }
  button {
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 8px 16px;
    border-radius: 4px;
    font-weight: 700;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
  }
  button:hover:not(:disabled) {
    background: var(--accent-hover);
    transform: translateY(-1px);
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  button.secondary {
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--border);
  }
  button.secondary:hover:not(:disabled) {
    background: var(--bg-lighter);
  }
  textarea.code-editor {
    width: 100%;
    min-height: 200px;
    background: var(--code-bg);
    color: #e6e6e6;
    border: none;
    padding: 16px;
    font-family: "Fira Code", "Courier New", monospace;
    font-size: 14px;
    line-height: 1.5;
    resize: vertical;
    outline: none;
    tab-size: 4;
  }
  .output-section {
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    background: #050510;
    min-height: 60px;
    max-height: 200px;
    overflow-y: auto;
    font-family: "Fira Code", monospace;
    font-size: 13px;
    white-space: pre-wrap;
  }
  .output-section.success { color: var(--success); }
  .output-section.error { color: var(--error); }
  .output-section.loading { color: var(--fg-dim); font-style: italic; }
  .task-description {
    background: rgba(55, 217, 138, 0.08);
    border-left: 4px solid var(--success);
    padding: 12px 16px;
    margin: 16px 0;
    border-radius: 4px;
  }
  .task-description strong { color: var(--success); }
  /* NAV BUTTONS */
  .lesson-nav {
    display: flex;
    justify-content: space-between;
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  /* WELCOME */
  .welcome {
    text-align: center;
    padding: 40px 20px;
  }
  .welcome h1 {
    font-size: 42px;
    color: var(--accent);
    margin-bottom: 16px;
  }
  .welcome p {
    font-size: 18px;
    color: var(--fg-dim);
    max-width: 600px;
    margin: 0 auto 24px;
  }
  .features {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin: 30px 0;
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
  }
  .feature {
    background: var(--bg-light);
    padding: 20px;
    border-radius: 8px;
    border: 1px solid var(--border);
    text-align: left;
  }
  .feature-icon {
    font-size: 28px;
    margin-bottom: 8px;
  }
  .feature h3 {
    color: var(--accent);
    margin-bottom: 6px;
  }
  .feature p {
    font-size: 14px;
    color: var(--fg-dim);
    margin: 0;
  }
  /* LOADING OVERLAY */
  .loading-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10, 10, 35, 0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  .spinner {
    width: 60px; height: 60px;
    border: 4px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text {
    color: var(--fg);
    font-size: 16px;
  }
  /* MOBILE */
  .menu-toggle {
    display: none;
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 700;
  }
  @media (max-width: 768px) {
    .menu-toggle { display: block; }
    aside {
      position: fixed;
      left: -320px;
      top: 60px;
      height: calc(100vh - 60px);
      z-index: 100;
      transition: left 0.3s;
    }
    aside.open { left: 0; }
    main { padding: 20px; }
    .progress-bar { display: none; }
    .lesson-header h1 { font-size: 22px; }
  }
</style>
</head>
<body>

<div id="loadingOverlay" class="loading-overlay">
  <div class="spinner"></div>
  <div class="loading-text">Загружаем интерпретатор Python... (около 10 МБ)</div>
</div>

<header>
  <div style="display:flex; align-items:center; gap:12px;">
    <button class="menu-toggle" onclick="document.querySelector('aside').classList.toggle('open')">☰</button>
    <div class="logo">
      <div class="logo-icon">Py</div>
      <span>PyCamp</span>
    </div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-text" id="progressText">0 / 0 уроков</div>
</header>

<div class="container">
  <aside id="sidebar"></aside>
  <main id="main"></main>
</div>

<script>
/* =========================================================
   ДАННЫЕ КУРСА
   ========================================================= */
const COURSE = {
  title: "Полный курс Python",
  modules: [
    {
      title: "1. Введение в Python",
      lessons: [
        {
          id: "1-1",
          title: "Что такое Python?",
          content: `
            <h2>Добро пожаловать в мир Python!</h2>
            <p><strong>Python</strong> — это высокоуровневый язык программирования общего назначения, созданный Гвидо ван Россумом в 1991 году. Сегодня это один из самых популярных языков в мире.</p>
            <h3>Почему Python?</h3>
            <ul>
              <li><strong>Простой синтаксис</strong> — читается почти как английский текст</li>
              <li><strong>Огромное сообщество</strong> — миллионы разработчиков</li>
              <li><strong>Универсальность</strong> — веб, наука, игры, ИИ, автоматизация</li>
              <li><strong>Богатая стандартная библиотека</strong> — «батарейки в комплекте»</li>
            </ul>
            <h3>Где применяется Python?</h3>
            <ul>
              <li>Веб-разработка (Django, Flask, FastAPI)</li>
              <li>Data Science и Machine Learning (NumPy, Pandas, PyTorch)</li>
              <li>Автоматизация и скрипты</li>
              <li>Разработка игр (Pygame)</li>
              <li>Тестирование и DevOps</li>
            </ul>
            <div class="info-box"><strong>Факт:</strong> Название «Python» произошло не от змеи, а от британского комедийного шоу «Летающий цирк Монти Пайтона».</div>
          `,
          task: "Выведите на экран фразу: <code>Привет, Python!</code>",
          starter: "# Напишите код здесь\n",
          solution: 'print("Привет, Python!")',
          tests: [
            { input: "", expected: "Привет, Python!" }
          ]
        },
        {
          id: "1-2",
          title: "Функция print()",
          content: `
            <h2>Вывод данных на экран</h2>
            <p>Функция <code>print()</code> выводит информацию в консоль. Это первая функция, с которой знакомится каждый программист.</p>
            <pre><code>print("Привет, мир!")
print(42)
print(3.14)</code></pre>
            <h3>Несколько аргументов</h3>
            <p>В <code>print()</code> можно передать несколько значений через запятую — они разделятся пробелом:</p>
            <pre><code>print("Меня зовут", "Алексей")
print("Возраст:", 25)</code></pre>
            <h3>Параметр sep</h3>
            <p>Можно изменить разделитель между значениями:</p>
            <pre><code>print("2026", "10", "09", sep="-")
# Выведет: 2026-10-09</code></pre>
            <h3>Параметр end</h3>
            <p>По умолчанию print заканчивает вывод символом новой строки. Это можно изменить:</p>
            <pre><code>print("Привет", end=" ")
print("мир")
# Выведет: Привет мир</code></pre>
          `,
          task: "Выведите три строки: <code>Python</code>, <code>это</code>, <code>круто</code> — каждую с новой строки.",
          starter: "# Три вызова print\n",
          solution: 'print("Python")\nprint("это")\nprint("круто")',
          tests: [
            { input: "", expected: "Python\nэто\nкруто" }
          ]
        },
        {
          id: "1-3",
          title: "Комментарии",
          content: `
            <h2>Комментарии в коде</h2>
            <p>Комментарии — это пояснения в коде, которые игнорируются интерпретатором. Они нужны для вас и других разработчиков.</p>
            <h3>Однострочные комментарии</h3>
            <p>Начинаются с символа <code>#</code>:</p>
            <pre><code># Это комментарий
print("Привет")  # И это тоже комментарий</code></pre>
            <h3>Многострочные комментарии</h3>
            <p>В Python нет отдельного синтаксиса для многострочных комментариев, но можно использовать тройные кавычки:</p>
            <pre><code>"""
Это многострочный
комментарий (или docstring)
"""
print("Код работает")</code></pre>
            <div class="info-box"><strong>Совет:</strong> Пишите комментарии, объясняющие <em>почему</em> вы сделали что-то, а не <em>что</em> делает код. Хороший код должен быть самодокументируемым.</div>
          `,
          task: "Напишите комментарий <code># Мой первый код</code> и выведите слово <code>Готово</code>.",
          starter: "# Напишите комментарий и print\n",
          solution: '# Мой первый код\nprint("Готово")',
          tests: [
            { input: "", expected: "Готово" }
          ]
        }
      ]
    },
    {
      title: "2. Переменные и типы данных",
      lessons: [
        {
          id: "2-1",
          title: "Переменные",
          content: `
            <h2>Что такое переменная?</h2>
            <p>Переменная — это именованная ячейка памяти, в которой хранятся данные. В Python не нужно объявлять тип переменной — он определяется автоматически.</p>
            <pre><code>name = "Алиса"
age = 25
height = 1.68
is_student = True

print(name)
print(age)</code></pre>
            <h3>Правила именования</h3>
            <ul>
              <li>Имя может содержать буквы, цифры, символ <code>_</code></li>
              <li>Не может начинаться с цифры</li>
              <li>Регистр имеет значение: <code>Age</code> и <code>age</code> — разные переменные</li>
              <li>Нельзя использовать зарезервированные слова (<code>if</code>, <code>for</code>, <code>class</code> и др.)</li>
            </ul>
            <h3>Стиль именования</h3>
            <p>В Python принято использовать <strong>snake_case</strong> для переменных:</p>
            <pre><code>user_name = "Bob"      # ✓ Хорошо
userName = "Bob"       # ✗ Не по-питоновски
x = "Bob"              # ✗ Непонятно</code></pre>
          `,
          task: "Создайте переменные <code>x = 10</code> и <code>y = 20</code>, выведите их сумму.",
          starter: "# Создайте переменные и выведите сумму\n",
          solution: 'x = 10\ny = 20\nprint(x + y)',
          tests: [
            { input: "", expected: "30" }
          ]
        },
        {
          id: "2-2",
          title: "Числовые типы",
          content: `
            <h2>Целые и вещественные числа</h2>
            <p>В Python два основных числовых типа:</p>
            <ul>
              <li><code>int</code> — целые числа: <code>42</code>, <code>-7</code>, <code>0</code></li>
              <li><code>float</code> — числа с плавающей точкой: <code>3.14</code>, <code>-0.5</code></li>
            </ul>
            <pre><code>a = 10        # int
b = 3.14      # float

print(type(a))  # &lt;class 'int'&gt;
print(type(b))  # &lt;class 'float'&gt;</code></pre>
            <h3>Арифметические операции</h3>
            <pre><code>print(10 + 3)   # 13  — сложение
print(10 - 3)   # 7   — вычитание
print(10 * 3)   # 30  — умножение
print(10 / 3)   # 3.333... — деление
print(10 // 3)  # 3   — целочисленное деление
print(10 % 3)   # 1   — остаток от деления
print(10 ** 3)  # 1000 — возведение в степень</code></pre>
            <div class="info-box"><strong>Важно:</strong> Оператор <code>/</code> всегда возвращает <code>float</code>, даже если числа целые. Для целочисленного деления используйте <code>//</code>.</div>
          `,
          task: "Вычислите и выведите результат: <code>17</code> в степени <code>2</code>.",
          starter: "# Возведите 17 в степень 2\n",
          solution: 'print(17 ** 2)',
          tests: [
            { input: "", expected: "289" }
          ]
        },
        {
          id: "2-3",
          title: "Строки",
          content: `
            <h2>Работа со строками</h2>
            <p>Строка (<code>str</code>) — это последовательность символов. Создаётся в одинарных или двойных кавычках:</p>
            <pre><code>s1 = "Привет"
s2 = 'Мир'
s3 = """Многострочная
строка"""</code></pre>
            <h3>Конкатенация и повторение</h3>
            <pre><code>print("Привет" + " " + "мир")   # Привет мир
print("Ха" * 3)                  # ХаХаХа</code></pre>
            <h3>Длина строки</h3>
            <pre><code>text = "Python"
print(len(text))  # 6</code></pre>
            <h3>F-строки (форматирование)</h3>
            <p>Самый удобный способ вставлять переменные в строку:</p>
            <pre><code>name = "Аня"
age = 20
print(f"Меня зовут {name}, мне {age} лет")</code></pre>
          `,
          task: "Создайте переменные <code>name = \"Python\"</code> и <code>version = 3</code>. Выведите: <code>Python 3</code> (используя f-строку или конкатенацию).",
          starter: "# Создайте переменные и выведите строку\n",
          solution: 'name = "Python"\nversion = 3\nprint(f"{name} {version}")',
          tests: [
            { input: "", expected: "Python 3" }
          ]
        },
        {
          id: "2-4",

/* =========================================================

   ========================================================= */
let pyodide = null;
let currentLessonId = null;
let completedLessons = new Set(JSON.parse(localStorage.getItem('pycamp_completed') || '[]'));

// Собираем плоский список уроков
const ALL_LESSONS = [];
COURSE.modules.forEach(mod => {
  mod.lessons.forEach(lesson => {
    ALL_LESSONS.push({ ...lesson, module: mod.title });
  });
});

/* =========================================================
   ИНИЦИАЛИЗАЦИЯ PYODIDE
   ========================================================= */
async function initPyodide() {
  try {
    pyodide = await loadPyodide();
    document.getElementById('loadingOverlay').style.display = 'none';
    renderSidebar();
    renderWelcome();
    updateProgress();
  } catch (e) {
    document.querySelector('.loading-text').textContent = 
      'Ошибка загрузки Python. Проверьте интернет-соединение и обновите страницу.';
    console.error(e);
  }
}

/* =========================================================
   РЕНДЕРИНГ SIDEBAR
   ========================================================= */
function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = COURSE.modules.map((mod, mi) => `
    <div class="module ${mi === 0 ? 'open' : ''}" data-module="${mi}">
      <div class="module-title" onclick="this.parentElement.classList.toggle('open')">
        <span>${mod.title}</span>
        <span class="arrow">▶</span>
      </div>
      <div class="lessons">
        ${mod.lessons.map(lesson => `
          <div class="lesson-item ${completedLessons.has(lesson.id) ? 'done' : ''} ${currentLessonId === lesson.id ? 'active' : ''}"
               onclick="loadLesson('${lesson.id}')">
            ${lesson.title}
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

/* =========================================================
   ЗАГРУЗКА УРОКА
   ========================================================= */
function loadLesson(id) {
  const lesson = ALL_LESSONS.find(l => l.id === id);
  if (!lesson) return;
  currentLessonId = id;
  
  const idx = ALL_LESSONS.findIndex(l => l.id === id);
  const prev = idx > 0 ? ALL_LESSONS[idx - 1] : null;
  const next = idx < ALL_LESSONS.length - 1 ? ALL_LESSONS[idx + 1] : null;
  
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="lesson-header">
      <div class="breadcrumb">${lesson.module}</div>
      <h1>${lesson.title}</h1>
    </div>
    <div class="lesson-content">
      ${lesson.content}
      <div class="task-description">
        <strong>🎯 Задание:</strong> ${lesson.task}
      </div>
    </div>
    <div class="editor-section">
      <div class="editor-header">
        <div class="title">📝 Редактор кода</div>
        <div class="editor-actions">
          <button class="secondary" onclick="resetCode()">Сбросить</button>
          <button class="secondary" onclick="showSolution()">Решение</button>
          <button onclick="runCode()" id="runBtn">▶ Запустить</button>
        </div>
      </div>
      <textarea class="code-editor" id="codeEditor" spellcheck="false">${lesson.starter}</textarea>
      <div class="output-section loading" id="output">Нажмите «Запустить», чтобы выполнить код</div>
    </div>
    <div class="lesson-nav">
      ${prev ? `<button class="secondary" onclick="loadLesson('${prev.id}')">← ${prev.title}</button>` : '<div></div>'}
      ${next ? `<button onclick="loadLesson('${next.id}')">${next.title} →</button>` : '<div></div>'}
    </div>
  `;
  
  main.scrollTop = 0;
  renderSidebar();
  
  // Закрытие сайдбара на мобильных
  if (window.innerWidth <= 768) {
    document.querySelector('aside').classList.remove('open');
  }
  
  // Поддержка Tab в редакторе
  const editor = document.getElementById('codeEditor');
  editor.addEventListener('keydown', function(e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = this.selectionStart;
      const end = this.selectionEnd;
      this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
      this.selectionStart = this.selectionEnd = start + 4;
    }
    // Ctrl+Enter для запуска
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      runCode();
    }
  });
}

/* =========================================================
   ВЫПОЛНЕНИЕ КОДА
   ========================================================= */
async function runCode() {
  const lesson = ALL_LESSONS.find(l => l.id === currentLessonId);
  const code = document.getElementById('codeEditor').value;
  const output = document.getElementById('output');
  const runBtn = document.getElementById('runBtn');
  
  runBtn.disabled = true;
  runBtn.textContent = '⏳ Выполняется...';
  output.className = 'output-section loading';
  output.textContent = 'Выполнение кода...';
  
  try {
    // Перехватываем вывод через StringIO
    pyodide.runPython(`
import sys
from io import StringIO
_sys_out = StringIO()
_sys_err = StringIO()
sys.stdout = _sys_out
sys.stderr = _sys_err
    `);
    
    await pyodide.runPythonAsync(code);
    
    const stdout = pyodide.runPython('_sys_out.getvalue()').replace(/\n$/, '');
    const stderr = pyodide.runPython('_sys_err.getvalue()');
    
    pyodide.runPython(`
sys.stdout = sys.__stdout__
sys.stderr = sys.__stderr__
    `);
    
    if (stderr) {
      output.className = 'output-section error';
      output.textContent = 'Ошибка:\n' + stderr;
    } else {
      // Проверяем тесты
      const testResults = checkTests(lesson, stdout);
      if (testResults.passed) {
        output.className = 'output-section success';
        output.innerHTML = `✅ <strong>Отлично! Задание выполнено!</strong>\n\nВывод программы:\n${stdout}\n\n→ Переходите к следующему уроку.`;
        markCompleted(lesson.id);
      } else {
        output.className = 'output-section error';
        output.innerHTML = `❌ <strong>Пока не совсем верно.</strong>\n\nВаш вывод:\n${stdout || '(пусто)'}\n\nОжидалось:\n${testResults.expected}\n\n${testResults.hint}`;
      }
    }
  } catch (e) {
    pyodide.runPython(`
import sys
sys.stdout = sys.__stdout__
sys.stderr = sys.__stderr__
    `);
    output.className = 'output-section error';
    output.textContent = '❌ Ошибка выполнения:\n' + e.message;
  } finally {
    runBtn.disabled = false;
    runBtn.textContent = '▶ Запустить';
  }
}

function checkTests(lesson, actual) {
  for (const test of lesson.tests) {
    const expected = test.expected;
    const actualTrimmed = actual.trim();
    const expectedTrimmed = expected.trim();
    
    if (actualTrimmed !== expectedTrimmed) {
      return {
        passed: false,
        expected: expectedTrimmed,
        hint: 'Проверьте вывод программы. Он должен точно совпадать с ожидаемым (включая регистр и пробелы).'
      };
    }
  }
  return { passed: true };
}

/* =========================================================
   ДОПОЛНИТЕЛЬНЫЕ ДЕЙСТВИЯ
   ========================================================= */
function resetCode() {
  const lesson = ALL_LESSONS.find(l => l.id === currentLessonId);
  document.getElementById('codeEditor').value = lesson.starter;
  document.getElementById('output').className = 'output-section loading';
  document.getElementById('output').textContent = 'Код сброшен. Нажмите «Запустить».';
}

function showSolution() {
  const lesson = ALL_LESSONS.find(l => l.id === currentLessonId);
  if (confirm('Показать решение? Попробуйте сначала сами!')) {
    document.getElementById('codeEditor').value = lesson.solution;
  }
}

function markCompleted(id) {
  completedLessons.add(id);
  localStorage.setItem('pycamp_completed', JSON.stringify([...completedLessons]));
  updateProgress();
  renderSidebar();
}

function updateProgress() {
  const total = ALL_LESSONS.length;
  const done = completedLessons.size;
  const pct = total > 0 ? (done / total) * 100 : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${done} / ${total} уроков`;
}

/* =========================================================
   СТАРТ
   ========================================================= */
window.addEventListener('DOMContentLoaded', initPyodide);
</script>
